<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
        <defs>
          <radialGradient id="bg" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#0f2b38"/>
            <stop offset="100%" stop-color="#040d12"/>
          </radialGradient>
          <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#00c6ff"/>
            <stop offset="100%" stop-color="#0072ff"/>
          </linearGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
            <feMerge>
              <feMergeNode in="coloredBlur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <rect width="200" height="200" fill="url(#bg)"/>
        <!-- 3D Diamond V-Line Overlay -->
        <polygon points="100,30 145,75 100,165 55,75" fill="none" stroke="url(#cyan)" stroke-width="3" filter="url(#glow)"/>
        <polygon points="100,30 100,165" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
        <line x1="55" y1="75" x2="145" y2="75" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
        <!-- V-Shape Sharp Chin Lines -->
        <path d="M60 90 L100 160 L140 90" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        <circle cx="100" cy="160" r="6" fill="#00c6ff" filter="url(#glow)"/>
        <circle cx="100" cy="30" r="4" fill="#ffffff" filter="url(#glow)"/>
      </svg>