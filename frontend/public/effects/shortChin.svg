<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
        <defs>
          <radialGradient id="bg" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#2d1b4e"/>
            <stop offset="100%" stop-color="#0e081c"/>
          </radialGradient>
          <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffe259"/>
            <stop offset="100%" stop-color="#ffa751"/>
          </linearGradient>
          <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#a855f7"/>
            <stop offset="100%" stop-color="#6366f1"/>
          </linearGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
              <feMergeNode in="coloredBlur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <rect width="200" height="200" fill="url(#bg)"/>
        <!-- Face Silhouette -->
        <path d="M60 60 C60 20 140 20 140 60 C140 100 130 120 100 135 C70 120 60 100 60 60 Z" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
        <!-- Short Chin Contour Guide -->
        <path d="M75 110 Q100 125 125 110" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
        <path d="M85 125 Q100 135 115 125" fill="none" stroke="url(#purple)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
        <!-- Upward Arrow indicator for chin tuck -->
        <path d="M100 145 L100 115 M92 123 L100 115 L108 123" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        <circle cx="100" cy="100" r="4" fill="#ffffff" filter="url(#glow)"/>
        <circle cx="75" cy="110" r="3" fill="#ffe259"/>
        <circle cx="125" cy="110" r="3" fill="#ffe259"/>
      </svg>