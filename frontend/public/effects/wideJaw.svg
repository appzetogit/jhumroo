<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
        <defs>
          <radialGradient id="bg" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#3b1d11"/>
            <stop offset="100%" stop-color="#120804"/>
          </radialGradient>
          <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#ff7e5f"/>
            <stop offset="100%" stop-color="#feb47b"/>
          </linearGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
              <feMergeNode in="coloredBlur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <rect width="200" height="200" fill="url(#bg)"/>
        <!-- Chiseled Wide Jaw Mesh -->
        <path d="M45 80 L65 140 L100 160 L135 140 L155 80" fill="none" stroke="url(#amber)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        <!-- Outward expansion arrows -->
        <path d="M40 110 L20 110 M28 103 L20 110 L28 117" fill="none" stroke="#ff7e5f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        <path d="M160 110 L180 110 M172 103 L180 110 L172 117" fill="none" stroke="#ff7e5f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        <!-- Jaw Nodes -->
        <circle cx="65" cy="140" r="5" fill="#ffffff" filter="url(#glow)"/>
        <circle cx="135" cy="140" r="5" fill="#ffffff" filter="url(#glow)"/>
        <circle cx="100" cy="160" r="4" fill="#feb47b"/>
      </svg>