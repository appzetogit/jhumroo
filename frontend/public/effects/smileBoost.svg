<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
        <defs>
          <radialGradient id="bg" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#4a1525"/>
            <stop offset="100%" stop-color="#140409"/>
          </radialGradient>
          <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#ff4b1f"/>
            <stop offset="100%" stop-color="#ff9068"/>
          </linearGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
              <feMergeNode in="coloredBlur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <rect width="200" height="200" fill="url(#bg)"/>
        <!-- Glowing Smile Lips Curve -->
        <path d="M45 95 Q100 160 155 95 Q100 120 45 95 Z" fill="url(#pink)" opacity="0.85" filter="url(#glow)"/>
        <path d="M40 90 Q100 165 160 90" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
        <!-- Upward smile cheek sparkles -->
        <path d="M35 80 Q45 60 55 75" fill="none" stroke="#ff9068" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
        <path d="M165 80 Q155 60 145 75" fill="none" stroke="#ff9068" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
        <!-- Sparkle Stars -->
        <polygon points="100,35 103,45 113,48 103,51 100,61 97,51 87,48 97,45" fill="#ffffff" filter="url(#glow)"/>
      </svg>