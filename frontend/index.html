<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no" />
    <title>Jhumroo</title>
    <script>
      // Prevent pinch-to-zoom (multi-touch)
      document.addEventListener('touchstart', function (event) {
        if (event.touches.length > 1) {
          event.preventDefault();
        }
      }, { passive: false });

      // Prevent Safari gesture zoom
      document.addEventListener('gesturestart', function (event) {
        event.preventDefault();
      });

      // Prevent Ctrl + Mouse Wheel zoom (desktop)
      document.addEventListener('wheel', function (event) {
        if (event.ctrlKey) {
          event.preventDefault();
        }
      }, { passive: false });

      // Prevent Ctrl + +/- keys zoom (desktop)
      document.addEventListener('keydown', function (event) {
        if (event.ctrlKey && (event.key === '=' || event.key === '-' || event.key === '+' || event.keyCode === 187 || event.keyCode === 189 || event.keyCode === 48 || event.key === '0')) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
