# Merge into your existing jhumroo.in server block (keep your SSL / certbot lines as they are).
# Then: sudo nginx -t && sudo systemctl reload nginx

upstream jhumroo_api    { server 127.0.0.1:5007; keepalive 64; }
upstream jhumroo_socket { server 127.0.0.1:5008; }

server {
    server_name jhumroo.in www.jhumroo.in;
    # listen 443 ssl; ssl_certificate ...;   <- your existing lines

    client_max_body_size 120m;   # legacy multipart video upload (MAX_VIDEO_SIZE_MB=100)

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # Web build (frontend/dist). Hashed assets never change -> cache for a year.
    root /var/www/jhumroo/frontend/dist;   # <- adjust to where dist lives
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://jhumroo_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";          # reuse upstream connections (keepalive)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /socket.io/ {
        proxy_pass http://jhumroo_socket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
